
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340">

  <defs>
    <radialGradient id="space">
      <stop offset="0%" stop-color="#24204f"/>
      <stop offset="55%" stop-color="#10152d"/>
      <stop offset="100%" stop-color="#05070e"/>
    </radialGradient>

    <linearGradient id="nebula" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7857ff"/>
      <stop offset="100%" stop-color="#ff3cac"/>
      <animate attributeName="x1"
        values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="340" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#space)"/>

    <!-- Animated nebula -->
    <ellipse cx="250" cy="80" rx="280" ry="95"
      fill="url(#nebula)" opacity=".19" filter="url(#glow)">
      <animate attributeName="cx"
        values="250;950;250" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="ry"
        values="65;125;65" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="950" cy="260" rx="300" ry="75"
      fill="url(#nebula)" opacity=".2" filter="url(#glow)">
      <animate attributeName="cx"
        values="950;250;950" dur="17s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Moving stars -->
    <g fill="#ffffff">
      <circle cx="100" cy="80" r="2">
        <animate attributeName="cy" values="80;260;80"
          dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;1;.2"
          dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="250" r="1.5">
        <animate attributeName="cy" values="250;60;250"
          dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="450" cy="55" r="2">
        <animate attributeName="opacity" values=".1;1;.1"
          dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="720" cy="275" r="2">
        <animate attributeName="cy" values="275;65;275"
          dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="75" r="1.5">
        <animate attributeName="opacity" values="1;.2;1"
          dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="240" r="2">
        <animate attributeName="cy" values="240;70;240"
          dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbital rings -->
    <g transform="translate(600 170)" fill="none"
       stroke="#7e8cff" stroke-width="1" opacity=".45">
      <ellipse rx="330" ry="75" transform="rotate(-12)">
        <animateTransform attributeName="transform"
          type="rotate" from="-12" to="348"
          dur="35s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="370" ry="105" transform="rotate(18)"
        stroke="#00d9ff" opacity=".55">
        <animateTransform attributeName="transform"
          type="rotate" from="18" to="-342"
          dur="45s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Name only -->
    <text x="600" y="190"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="64"
      font-weight="800"
      letter-spacing="1"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="2.5"
      paint-order="stroke fill"
      filter="url(#glow)">Touhiduzzaman Anik</text>

    <!-- Subtle animated underline -->
    <rect x="390" y="218" width="420" height="2"
      rx="1" fill="url(#nebula)">
      <animate attributeName="width"
        values="160;420;160" dur="5s"
        repeatCount="indefinite"/>
      <animate attributeName="x"
        values="520;390;520" dur="5s"
        repeatCount="indefinite"/>
    </rect>

    <rect x="1" y="1" width="1198" height="338"
      rx="18" fill="none" stroke="#6977ff"
      stroke-opacity=".35"/>
  </g>
</svg>
